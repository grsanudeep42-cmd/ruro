name: Ruro
description: GitHub OS — deterministic fleet truth + optional Copilot audit.
author: Ruro
branding:
  icon: activity
  color: blue

inputs:
  token:
    description: GitHub token with repo read/write for scanned repos and optional profile README sync.
    required: true
  config-path:
    description: Path to ruro config YAML.
    required: false
    default: ruro.yml
  owner:
    description: GitHub user or org to scan. Defaults to config or the current repository owner.
    required: false
  dry-run:
    description: If true, compute scores but do not write files.
    required: false
    default: "false"
  sync-profile:
    description: Override profile README sync (true/false). Defaults to config profile.enabled.
    required: false
    default: ""

outputs:
  repo-count:
    description: Number of repositories scored.
  dashboard-path:
    description: Path to the generated dashboard markdown.
  web-path:
    description: Path to the generated web dashboard HTML.
  profile-synced:
    description: Whether the profile README was updated.

runs:
  using: node20
  main: dist/index.js
