# Ruro config — COPY this file to get started:
#   cp ruro.example.yml ruro.yml
# Then set `owner` to YOUR GitHub username and run:
#   export GITHUB_TOKEN=…   # or GH_TOKEN
#   npm run ruro -- scan
#   npm run ruro
#
schema_version: 1

# REQUIRED — your GitHub login or org (not someone else's)
owner: YOUR_GITHUB_LOGIN

scan:
  # false = public repos only (safe for a public meta-repo)
  # true  = include privates (use a PRIVATE meta-repo + repo-scoped token)
  include_private: false
  include_forks: false
  include_archived: true
  exclude_repos:
    - ruro
    - ".github"

weights:
  # Must sum to 1.0 — Quality / Alive / Structure
  quality: 0.40
  alive: 0.35
  structure: 0.25

thresholds:
  active_days: 90
  stale_days: 180
  dormant_days: 365

probes:
  enabled: true
  timeout_ms: 8000
  user_agent: "ruro-probe/0.1"
  follow_redirects: true

render:
  dashboard_path: DASHBOARD.md
  data_path: data/latest.json
  history: true
  history_dir: data/history
  title: Ruro Portfolio Scorecard
  profile_snippet_path: PROFILE_SNIPPET.md
  profile_svg_path: assets/ruro-card.svg
  profile_top_n: 5
  web_path: docs/index.html
  overview_path: OVERVIEW.md

privacy:
  # public_only_render — strip privates from published surfaces (recommended for public repos)
  # full — write everything (only safe on a PRIVATE meta-repo)
  mode: public_only_render

profile:
  enabled: false
  # When enabled, set repo + your identity (never leave blank)
  repo: YOUR_GITHUB_LOGIN/YOUR_GITHUB_LOGIN
  readme_path: README.md
  commit_message: "chore(ruro): refresh profile portfolio truth"
  commit_author_name: ""
  commit_author_email: ""

ai:
  # Optional Copilot judgment — never moves scores
  enabled: false
  provider: copilot
  top_n: 5
  cache_dir: data/ai
  timeout_ms: 180000
