name: Ruro Scorecard

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ruro-scorecard
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RURO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Ruro
        uses: ./
        with:
          token: ${{ secrets.RURO_TOKEN || github.token }}
          config-path: ruro.yml

      - name: Commit scorecard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ruro): refresh portfolio scorecard"
          file_pattern: DASHBOARD.md data/latest.json data/history/*.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
