# Ruro — portfolio scorecard config
schema_version: 1

owner: grsanudeep42-cmd

scan:
  # Public meta-repo: do not pull private repos into committed data/
  include_private: false
  include_forks: false
  include_archived: true
  exclude_repos:
    - ruro
    - ".github"

weights:
  quality: 0.40
  alive: 0.35
  structure: 0.25

thresholds:
  active_days: 90
  stale_days: 180
  dormant_days: 365

probes:
  enabled: true
  timeout_ms: 8000
  user_agent: "ruro-probe/0.1 (+https://github.com/grsanudeep42-cmd/ruro)"
  follow_redirects: true

render:
  dashboard_path: DASHBOARD.md
  data_path: data/latest.json
  history: true
  history_dir: data/history
  title: Ruro Portfolio Scorecard
  profile_snippet_path: PROFILE_SNIPPET.md
  profile_svg_path: assets/ruro-card.svg
  profile_top_n: 5
  web_path: docs/index.html
  overview_path: OVERVIEW.md

privacy:
  # Never publish private repo names into Pages / DASHBOARD / data on a public meta-repo
  mode: public_only_render

profile:
  enabled: false
  repo: grsanudeep42-cmd/grsanudeep42-cmd
  readme_path: README.md
  commit_message: "chore(ruro): refresh profile portfolio truth"
  # Required if profile.enabled — never leave blank when syncing
  commit_author_name: ""
  commit_author_email: ""

ai:
  # Off by default. Needs Copilot CLI + credits. Never affects scores.
  enabled: false
  provider: copilot
  top_n: 5
  cache_dir: data/ai
  timeout_ms: 180000
